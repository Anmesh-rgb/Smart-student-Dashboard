<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="dashboard">
         <nav id="nav1">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap cap"></i>
                <div id="name">
                    <p id="smart">Smart </p>
                    <div><p id="ot">Student Dashboard</p></div>
                </div>
            </div>
        </nav>
        
          <div class="row">
             <nav id="nav2">
             <h1>Smart Student Dashboard</h1>

                <button id="mode">
                    <i class="fa-solid fa-sun"></i>
                    <h4>Light mode</h4>

                </button>
             </nav>

              <div id="content">
                <div class="card1267">

                <div class="card12">
                <div class="card1 cards">
                    <h2>Student Information</h2>

                    <div>
                    <span>
                    <label for="Name">Name:</label>
                    <input type="text" placeholder="enter Name">
                    </span>
                    <span id="span-2">
                    <label for="class">Class:</label>
                    <input type="number" placeholder="enter Class">
                    </span>
                    <input type="button" value="Save Info" class="save_btn">
                    </div>

                </div>
                <div class="card2 cards"> 
                    <span>
                    <label for="name">Name:<h4>Anmesh Niraula</h4></label>
                    
                    </span>

                    <span>
                    <label for="Class">Class:<h4>10</h4></label>
                    </span>
                </div>

                <div class="card3 cards"> 
                    <label for="progress">Progress</label>
                    <div class="progress_cont">
                        <div class="progress"><h4> 82%</h4>
                        </div>
                    </div>
                </div>
                </div>

                <!-- starting card6 and card7 -->

                <div class="card67">
                    <div class="card6 cards">
                        <div>
                        <h2>subject & Marks</h2>
                    <div id="input_div">
                    <span>
                    <label for="subject">subject:</label>
                    <input type="text" placeholder="enter Subject Name">
                    </span>

                    <span id="span-2">
                    <label for="marks">Marks:</label>
                    <input type="number" placeholder="enter Marks">
                    </span>
                    <div id="sub-div">
                    <input type="button" value="Add Subject" id="sub-btn" class="sub-btn">
                    <input type="button" value="Display Result" id="result-btn" class="sub-btn">
                    </div>

                    </div>

                    <div id="result">
                        <h4>Total Marks : 00</h4>
                        <h4>Average : 00</h4>
                        <h4>Grade : A</h4>

                    </div>
                    </div>
                   

                    </div>
                     <div id="card7">
                        <p>sub1 : 90</p>
                        <p>sub2 : 80</p>
                        <p>sub1 : 90</p>
                        
        

                    </div>

                </div>

                </div>

                 
                <!-- div for card4 and card5 -->
                <div id="card45">

                <div class="card4 cards"> 
                    <h2>Dashboard Controls</h2>
                    <div id="input_div">
                    <button id="reset">
                        <i class="fa-solid fa-trash"></i>
                        <h4>Reset Dashboard</h4>
                    </button>
                    <button id="mode">
                    <i class="fa-solid fa-sun"></i>
                    <h4>Light mode</h4>

                </button>
                    
                    </div>
                </div>

                <div class="card5 cards"> 
                    <h2>Want a Challange?</h2>
                    <p>Test a Knowledge with a quick Quiz.</p>
                    <input type="button" value="Start Quiz" id="quiz_btn">
                    
                    
                </div>

                


                </div>


              </div>
         </div>

            
              

        
     </div>
   
 



    <script src="script.js"></script>
</body>
</html>
