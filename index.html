<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="dashboard">
         <nav id="nav1">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap cap"></i>
                <div id="name">
                    <p id="smart">Smart </p>
                    <div><p id="ot">Student Dashboard</p></div>
                </div>
            </div>
        </nav>
        
          <div class="row">
             <nav id="nav2">
             <h1>Smart Student Dashboard</h1>
                <input type="button" value="Light Mode" id="mode">
             </nav>

              <div id="content">
                <div class="card1 cards">
                    <h2>Student Information</h2>
                    <div>

                    <span>
                    <label for="Name">Name:</label>
                    <input type="text" placeholder="enter Name">
                    </span>
                    <span id="span-2">
                    <label for="class">Class:</label>
                    <input type="number" placeholder="enter Class">
                    </span>
                    <input type="button" value="Save Info" class="save_btn">
                    </div>
                </div>
                <div class="card2 cards"> 
                    <span>
                    <label for="name">Name:<h4>Anmesh Niraula</h4></label>
                    
                    </span>

                    <span>
                    <label for="Class">Class:<h4>10</h4></label>
                    </span>

                </div>

                 <div class="card3 cards"> 
                    <label for="progress">Progress</label>
                    <div class="progress_cont">
                        <div class="progress"><h4>82%</h4>
                        </div>
                    </div>
                </div>
                <!-- div for card4 and card5 -->
                <div id="card45">

                <div class="card4 cards"> 
                    <h2>Dashboard Controls</h2>
                    <div id="input_div">
                    <input type="button" value="Reset Dashboard" id="reset">
                    <input type="button" value="Darkmode" id="mode">
                    </div>
                </div>

                <div class="card5 cards"> 
                    <h2>Want a Challange?</h2>
                    <p>Test a Knowledge with a quick Quiz.</p>
                    <input type="button" value="Start Quiz" id="quiz_btn">
                    
                    
                </div>

                


                </div>


              </div>
         </div>

            
              

        
     </div>
   
 



    <script src="script.js"></script>
</body>
</html>
